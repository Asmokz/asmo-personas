[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vegas-bot"
version = "1.0.0"
description = "VEGAS — analyste financier PEA bot"
requires-python = ">=3.11"
dependencies = [
    "asmo-commons",
    "discord.py>=2.3.0",
    "structlog>=23.3.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "yfinance>=0.2.30",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "redis[hiredis]>=5.0.0",
    "numpy>=1.26.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
